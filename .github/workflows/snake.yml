#   .github/workflows/snake.yml
# Genera la animación de la serpiente que "se come" sus contribuciones, una vez al día.
name: Serpiente de contribuciones

on:
  schedule:
    - cron: "0 5 * * *"      # todos los días
  workflow_dispatch:          # también se puede ejecutar a mano (pestaña Actions > Run workflow)

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#2a78d6&color_dots=#ebedf0,#cde2fb,#6da7ec,#2a78d6,#0d366b
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#6250d6&color_dots=#161b22,#0d366b,#256abf,#2a78d6,#9ec5f4

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
